name: Rapor Guncelle

on:
  schedule:
    - cron: '0 5,11,17 * * *'
  workflow_dispatch:

jobs:
  update-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Repo'yu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Kutuphaneleri kur
        run: pip install -r requirements.txt

      - name: Testleri calistir
        run: pytest -v

      - name: Veriyi guncelle
        env:
          SCOPUS_API_KEY: ${{ secrets.SCOPUS_API_KEY }}
        run: python src/campus_analytics/data_ingestion/scopus_client.py

      - name: Raporu uret
        run: python main.py

      - name: Degisiklikleri commit et
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ report.json report.pdf
          git diff --staged --quiet || git commit -m "Otomatik veri ve rapor guncellemesi"
          git push