<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<title>Kocaeli Üniversitesi - Karşılaştırmalı Yayın Raporu</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
</head>
<body>
<div class="container">

  <h1>Üniversite Değişim Raporu</h1>
  <div class="subtitle" id="alt-baslik">Yükleniyor...</div>

  <a href="report.pdf" download class="btn-indir">📄 PDF Raporu İndir</a>

  <div class="tarih-secici-satiri">
    <label for="tarih-secici">Gösterilen tarih:</label>
    <select id="tarih-secici"></select>
  </div>

  <div class="kart-satiri" id="kart-satiri"></div>

  <div class="grid-2">
    <div class="panel">
      <h2>Yayın Dağılımı (İlk 10) <span class="aciklama">Kocaeli yeşil ile gösterilir</span></h2>
      <canvas id="pastaGrafik" height="260"></canvas>
    </div>
    <div class="panel">
      <h2>En Çok Artan 5 Üniversite</h2>
      <ul class="top-list" id="top-liste"></ul>
    </div>
  </div>

  <div class="panel" style="margin-bottom:28px;">
    <h2>Sistem Aktivite Geçmişi <span class="aciklama">(toplam yayın sayısı, gün bazlı)</span></h2>
    <canvas id="aktiviteGrafik" height="80"></canvas>
  </div>

  <table id="rapor-tablosu">
    <thead>
      <tr><th>Üniversite</th><th>Toplam Yayın</th><th>10G Değişim</th><th>30G Değişim</th><th>Momentum</th></tr>
    </thead>
    <tbody id="tablo-govdesi"></tbody>
  </table>

</div>
<script src="script.js"></script>
</body>
</html>
