<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<title>Üniversite Raporu</title>

<style>
  body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    color: #1e293b;
    margin: 40px;
  }
  h1 {
    color: #1e3a5f;
  }
  table {
    border-collapse: collapse;
    width: 100%;
    background: white;
    box-shadow: 0 1px 4px rgba(0,0,0,0.1);
  }
  th, td {
    padding: 10px 14px;
    text-align: left;
    border-bottom: 1px solid #e2e8f0;
  }
  th {
    background: #1e3a5f;
    color: white;
  }
  tr:hover {
    background: #f0f4f8;
  }
</style>

</head>
<body>

<h1>Üniversite Değişim Raporu</h1>
<a href="report.pdf" download style="display:inline-block; margin-bottom:20px; padding:10px 18px; background:#1e3a5f; color:white; text-decoration:none; border-radius:6px; font-family:Arial, sans-serif;">
  📄 PDF Raporu İndir
</a>
<table border="1" id="rapor-tablosu">
  <thead>
    <tr><th>Üniversite</th><th>Toplam Yayın</th><th>10G Değişim</th><th>30G Değişim</th><th>Momentum</th><th>Yıl Sonu Tahmini</th></tr>
  </thead>
  <tbody id="tablo-govdesi"></tbody>
</table>

<script>
fetch("report.json")
  .then(response => response.json())
  .then(rapor => {
    const govde = document.getElementById("tablo-govdesi");
    rapor.universities.forEach(uni => {
      const change10 = uni.change_10d.change_pct !== null ? uni.change_10d.change_pct + "%" : "yetersiz veri";
      const change30 = uni.change_30d.change_pct !== null ? uni.change_30d.change_pct + "%" : "yetersiz veri";
      const momentum = uni.momentum.momentum !== null ? uni.momentum.momentum : "yetersiz veri";
      const estimate = uni.year_end_estimate.estimate !== null ? uni.year_end_estimate.estimate : "yetersiz veri";

      const satir = document.createElement("tr");
      satir.innerHTML = `
        <td>${uni.university}</td>
        <td>${uni.new_value}</td>
        <td>${change10}</td>
        <td>${change30}</td>
        <td>${momentum}</td>
        <td>${estimate}</td>
      `;
      govde.appendChild(satir);
    });
  });
</script>

</body>
</html>
